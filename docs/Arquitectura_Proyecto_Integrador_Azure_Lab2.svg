<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#102A43}.subtitle{font:16px Arial,sans-serif;fill:#486581}
      .group{fill:#FAFCFE;stroke:#1F6F8B;stroke-width:3}.subnet{fill:#FFFFFF;stroke:#9ABBD0;stroke-width:2}
      .card{fill:#F5F8FA;stroke:#486581;stroke-width:2}.web{fill:#E6F2FF}.data{fill:#EAF7EA}.vm{fill:#FFF4E5}.monitor{fill:#F1ECFF}.muted{fill:#FAFAFA;stroke-dasharray:9 6}
      .h1{font:700 18px Arial,sans-serif;fill:#102A43}.h2{font:700 15px Arial,sans-serif;fill:#243B53}.body{font:14px Arial,sans-serif;fill:#334E68}.small{font:12px Arial,sans-serif;fill:#486581}
      .line{fill:none;stroke:#526D82;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.label{font:12px Arial,sans-serif;fill:#334E68}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526D82"/></marker>
  </defs>

  <rect width="1600" height="1120" fill="#FFFFFF"/>
  <text x="800" y="46" text-anchor="middle" class="title">Arquitectura del proyecto integrador en Azure Lab 2</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">Región Chile Central · Red privada · Monitoreo integrado</text>

  <rect x="650" y="105" width="300" height="72" rx="20" class="card"/>
  <text x="800" y="135" text-anchor="middle" class="h1">Usuarios</text><text x="800" y="158" text-anchor="middle" class="body">Acceso desde Internet</text>

  <rect x="590" y="220" width="420" height="115" rx="16" class="card web"/>
  <text x="800" y="253" text-anchor="middle" class="h1">Linux Web App</text>
  <text x="800" y="279" text-anchor="middle" class="body">Node.js 24 LTS · HTTPS obligatorio · TLS 1.2</text>
  <text x="800" y="304" text-anchor="middle" class="small">App Service Plan Basic B1</text>
  <path d="M800 177 V220" class="line"/><text x="820" y="204" class="label">HTTPS</text>

  <rect x="70" y="385" width="1080" height="650" rx="24" class="group"/>
  <text x="105" y="423" class="h1">VNet 10.0.0.0/16</text>
  <text x="105" y="448" class="small">Segmentación por función y grupos de seguridad de red</text>

  <rect x="110" y="475" width="1000" height="92" rx="14" class="subnet"/>
  <text x="140" y="505" class="h2">Subred App · 10.0.1.0/24</text>
  <rect x="520" y="491" width="330" height="58" rx="12" class="card web"/>
  <text x="685" y="518" text-anchor="middle" class="h2">Integración de App Service</text><text x="685" y="539" text-anchor="middle" class="small">Delegada a Microsoft.Web/serverFarms</text>

  <rect x="110" y="595" width="1000" height="112" rx="14" class="subnet"/>
  <text x="140" y="625" class="h2">Subred DB · 10.0.2.0/24</text>
  <rect x="520" y="617" width="330" height="66" rx="12" class="card data"/>
  <text x="685" y="645" text-anchor="middle" class="h2">Private Endpoint PostgreSQL</text><text x="685" y="667" text-anchor="middle" class="small">Conexión aprobada</text>

  <rect x="110" y="735" width="1000" height="112" rx="14" class="subnet"/>
  <text x="140" y="765" class="h2">Subred VM · 10.0.3.0/24</text>
  <rect x="460" y="752" width="450" height="78" rx="12" class="card vm"/>
  <text x="685" y="780" text-anchor="middle" class="h2">VM Windows Server 2025</text>
  <text x="685" y="803" text-anchor="middle" class="body">Standard B2als v2 · IP privada 10.0.3.4 · sin IP pública</text>

  <rect x="110" y="875" width="1000" height="112" rx="14" class="subnet"/>
  <text x="140" y="905" class="h2">Subred Private Endpoints · 10.0.4.0/24</text>
  <rect x="520" y="897" width="330" height="66" rx="12" class="card data"/>
  <text x="685" y="925" text-anchor="middle" class="h2">Private Endpoint Blob</text><text x="685" y="947" text-anchor="middle" class="small">Conexión aprobada</text>

  <rect x="900" y="475" width="180" height="92" rx="14" class="card muted"/>
  <text x="990" y="505" text-anchor="middle" class="h2">AzureBastionSubnet</text>
  <text x="990" y="528" text-anchor="middle" class="small">10.0.5.0/26</text><text x="990" y="549" text-anchor="middle" class="small">reservada</text>

  <rect x="1200" y="530" width="350" height="170" rx="16" class="card data"/>
  <text x="1375" y="565" text-anchor="middle" class="h1">PostgreSQL Flexible Server 18</text>
  <text x="1375" y="594" text-anchor="middle" class="body">B1ms · 32 GiB · BD integradora</text>
  <text x="1375" y="620" text-anchor="middle" class="body">Acceso público deshabilitado</text>
  <text x="1375" y="654" text-anchor="middle" class="small">DNS privada</text>
  <text x="1375" y="676" text-anchor="middle" class="small">privatelink.postgres.database.azure.com</text>

  <rect x="1200" y="805" width="350" height="170" rx="16" class="card data"/>
  <text x="1375" y="840" text-anchor="middle" class="h1">StorageV2 Standard LRS</text>
  <text x="1375" y="869" text-anchor="middle" class="body">Contenedor Blob smartrh · nivel Hot</text>
  <text x="1375" y="895" text-anchor="middle" class="body">Acceso público deshabilitado</text>
  <text x="1375" y="929" text-anchor="middle" class="small">DNS privada</text>
  <text x="1375" y="951" text-anchor="middle" class="small">privatelink.blob.core.windows.net</text>

  <rect x="1200" y="110" width="350" height="150" rx="16" class="card monitor"/>
  <text x="1375" y="145" text-anchor="middle" class="h1">Monitoreo</text>
  <text x="1375" y="177" text-anchor="middle" class="body">Application Insights</text>
  <text x="1375" y="203" text-anchor="middle" class="body">Log Analytics · retención 30 días</text>
  <text x="1375" y="231" text-anchor="middle" class="small">Telemetría de la Web App</text>

  <path d="M800 335 V491" class="line"/><text x="820" y="411" class="label">integración VNet</text>
  <path d="M850 650 H1200" class="line"/><text x="980" y="638" class="label">Private Link</text>
  <path d="M850 930 H1200" class="line"/><text x="980" y="918" class="label">Private Link</text>
  <path d="M910 790 H1160 V650 H1200" class="line"/><text x="1000" y="778" class="label">datos privados</text>
  <path d="M910 805 H1135 V930 H1200" class="line"/><text x="1000" y="835" class="label">archivos privados</text>
  <path d="M1010 275 H1160 V185 H1200" class="line"/><text x="1060" y="263" class="label">telemetría</text>
  <path d="M685 567 V617" class="line"/><text x="705" y="590" class="label">acceso DB</text>

  <text x="800" y="1082" text-anchor="middle" class="small">La arquitectura de laboratorio no cambia la persistencia actual de SMART RH, que continúa en MySQL y MongoDB.</text>
</svg>

